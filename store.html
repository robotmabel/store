<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store — MABEL Robotics</title>
<meta name="description" content="107 parts for research robots: joint modules, swerve drives, global-shutter cameras, lidar, Jetson compute, extrusion and fasteners. Stocked in Toronto.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/img/brand/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://robotmabel.github.io/store/store.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MABEL Robotics">
<meta property="og:title" content="Store — MABEL Robotics">
<meta property="og:description" content="107 parts for research robots: joint modules, swerve drives, global-shutter cameras, lidar, Jetson compute, extrusion and fasteners. Stocked in Toronto.">
<meta property="og:image" content="https://robotmabel.github.io/store/assets/img/products/mabel-assembled.svg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/store.css">
</head>
<body data-page="store" data-root="">
<a class="skip" href="#main">Skip to content</a>
<main id="main">
  <div class="wrap">
    <header class="store-head">
      <h1 class="t-title" id="storeTitle">Store</h1>
      <p class="t-sub" id="storeIntro" style="max-width:660px;margin-top:10px"></p>
      <p class="chip chip-warn" style="margin-top:16px">Surplus stock &middot; one build&rsquo;s worth of each</p>
    </header>

    <div class="store-layout">
      <aside class="filters" aria-label="Filter products">
        <div class="filter-g">
          <h2>Category</h2>
          <ul class="filter-list" id="catFilter"></ul>
        </div>
        <div class="filter-g">
          <h2>Brand</h2>
          <ul class="filter-list" id="brandFilter"></ul>
        </div>
        <div class="filter-g">
          <h2>Build</h2>
          <label class="f-check"><input type="checkbox" id="mabelOnly">
            <span>Parts used in MABEL</span></label>
        </div>
      </aside>

      <div>
        <div class="toolbar">
          <label class="vh" for="q">Search products</label>
          <input class="search-in" id="q" type="search" placeholder="Search 107 products"
                 autocomplete="off" spellcheck="false">
          <div class="row">
            <span class="t-small" id="count" aria-live="polite"></span>
            <label class="vh" for="sort">Sort by</label>
            <select class="sel" id="sort">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="name-asc">Name: A to Z</option>
            </select>
          </div>
        </div>
        <div class="active-f" id="activeF"></div>
        <div class="cards" id="grid"></div>
      </div>
    </div>
  </div>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages.js"></script>
<script>MABEL.pages.storePage();</script>
</body>
</html>
